global:
  edition: ce

  hosts:
    domain: local
    https: false

  ingress:
    class: traefik
    configureCertmanager: false
    tls:
      enabled: false

  initialRootPassword:
    secret: gitlab-root-password
    key: password

certmanager:
  install: false

nginx-ingress:
  enabled: false

prometheus:
  install: false

gitlab-runner:
  install: false

registry:
  enabled: false

minio:
  persistence:
    size: 2Gi

redis:
  master:
    persistence:
      size: 2Gi

postgresql:
  primary:
    persistence:
      size: 8Gi

gitlab:

  webservice:
    minReplicas: 1
    maxReplicas: 1

    resources:
      requests:
        cpu: 250m
        memory: 768Mi
      limits:
        cpu: 1
        memory: 1Gi

  sidekiq:
    minReplicas: 1
    maxReplicas: 1

    resources:
      requests:
        cpu: 200m
        memory: 512Mi
      limits:
        cpu: 500m
        memory: 768Mi

  gitaly:
    persistence:
      size: 10Gi

    resources:
      requests:
        cpu: 200m
        memory: 512Mi
      limits:
        cpu: 1
        memory: 1Gi

gitlab-shell:
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 250m
      memory: 256Mi

toolbox:
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 250m
      memory: 256Mi
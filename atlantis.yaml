version: 3

parallel_plan: true
parallel_apply: true

projects:
  - name: sandbox-s3
    dir: infra-live/sandbox/dev/us-east-1/infrastructure/logs

    terraform_version: "1.9.8"

    workflow: terragrunt

    autoplan:
      enabled: false

      when_modified:
        - "**/*.tf"
        - "**/*.hcl"
        - "**/*.tfvars"
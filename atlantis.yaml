version: 3

parallel_plan: true

parallel_apply: true

projects:
  - name: sandbox-s3

    dir: infra-live/sandbox/dev/us-east-1/infrastructure/logs

    workflow: terragrunt

    autoplan:
      enabled: false

      when_modified:
        - "**/*.tf"
        - "**/*.hcl"
        - "**/*.tfvars"

workflows:
  terragrunt:
    plan:
      steps:
        - run: terragrunt init
        - run: terragrunt plan -out=$PLANFILE

    apply:
      steps:
        - run: terragrunt apply $PLANFILE